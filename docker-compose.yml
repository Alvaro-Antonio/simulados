services:
  postgres:
    image: postgres:17
    container_name: simulados_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simulados_db
    volumes:
      - postgres_simulados_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simulados_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_simulados_data:
    name: postgres_simulados_data
